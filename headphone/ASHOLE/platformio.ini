[env:esp32dev]
; Public Classic Bluetooth PAN support was added after ESP-IDF 5.5.
; Pin the PlatformIO integration and use the locally cached ESP-IDF PAN commit.
platform = https://github.com/pioarduino/platform-espressif32.git#ed2878c14f86b9bff852bc0644e639e64798ab57
platform_packages =
    framework-espidf @ symlink:///Users/liyao/.platformio/local-frameworks/esp-idf-pan-51eacff
    toolchain-xtensa-esp-elf @ symlink://.deps/toolchain-xtensa-esp-elf
board = esp32dev
framework = espidf
monitor_speed = 115200
